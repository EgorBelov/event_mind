services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./eventmind.db:/app/eventmind.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: .
    command: python -m app.bot.main
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    command: python -m app.scheduler.digest
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
