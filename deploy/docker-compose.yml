# EventMind v2 — dev-стек. Запуск: `make up` (из корня репозитория).
# Поднимает: Postgres(pgvector) + Redis + api + web + Prometheus + Grafana + Mailhog.
# worker/scheduler добавятся в M3/M5 (тот же backend-образ, другая команда).
name: eventmind

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eventmind
      POSTGRES_PASSWORD: eventmind
      POSTGRES_DB: eventmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовый прогон миграций перед стартом api.
  migrate:
    build:
      context: ../backend
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://eventmind:eventmind@postgres:5432/eventmind
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://eventmind:eventmind@postgres:5432/eventmind
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6

  # arq-воркер: в M1 обрабатывает outbox (рассылка писем верификации/сброса).
  worker:
    build:
      context: ../backend
    command: ["arq", "eventmind.interfaces.worker.main.WorkerSettings"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://eventmind:eventmind@postgres:5432/eventmind
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Telegram-бот (M7): вторичный клиент, ходит в API по HTTP (X-API-Key).
  # Профиль `bot` — поднимается только при заданном BOT_TOKEN:
  #   docker compose --profile bot up
  bot:
    build:
      context: ../backend
    command: ["python", "-m", "eventmind.interfaces.bot.main"]
    profiles: ["bot"]
    env_file:
      - path: ../.env
        required: false
    environment:
      API_INTERNAL_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://eventmind:eventmind@postgres:5432/eventmind
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../web
    environment:
      API_BASE_URL: http://api:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"  # SMTP (dev-письма перехватываются здесь)
      - "8025:8025"  # веб-интерфейс для просмотра писем

volumes:
  pgdata:
  grafana-data:
