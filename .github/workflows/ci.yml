name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-sqlite:
    name: tests (SQLite)
    runs-on: ubuntu-latest
    env:
      # Тесты мокают реальные LLM-вызовы; фиктивный ключ нужен лишь чтобы
      # конструкция ChatGroq не падала на проверке «ключ задан».
      GROQ_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # SQLite-БД по умолчанию (DATABASE_URL не задан) — Postgres не нужен.
        run: pytest -q

  test-postgres:
    name: tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Образ pgvector/pgvector расширяет postgres:16 нужным расширением —
        # CREATE EXTENSION vector работает прямо «из коробки».
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eventmind
          POSTGRES_PASSWORD: eventmind
          POSTGRES_DB: eventmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GROQ_API_KEY: ci-dummy-key
      DATABASE_URL: postgresql+psycopg2://eventmind:eventmind@localhost:5432/eventmind
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # psycopg2 уже в requirements; на всякий случай ставим бинарный
          # build на случай, если в проде нужен только клиент.
          pip install psycopg2-binary

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U eventmind && break
            sleep 1
          done

      - name: Enable pgvector extension
        env:
          PGPASSWORD: eventmind
        run: |
          psql -h localhost -U eventmind -d eventmind -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Run critical PG/pgvector tests
        # Прогоняем именно те тесты, что покрывают backend-зависимые пути:
        # dedup (с <=>-запросом), retrieval, pgvector-обвязку, кэш и ingestion.
        run: |
          pytest -q \
            tests/test_pgvector.py \
            tests/test_dedup.py \
            tests/test_retrieval.py \
            tests/test_recommendation_cache.py \
            tests/test_feed_cursor.py \
            tests/test_ingestion.py
