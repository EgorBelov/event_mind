name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── backend: lint → mypy → import-linter → tests(unit+integration) ─────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy src eval

      - name: Import boundaries (import-linter)
        run: uv run lint-imports

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Offline-eval (детерминизм, seed=42)
        run: uv run python -m eval.run

      # Integration-тесты поднимают Postgres(pgvector)+Redis через testcontainers.
      # На ubuntu-runner'е Docker доступен из коробки.
      - name: Integration tests (testcontainers)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest tests/integration -m integration

  # ── web: typecheck + build ────────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ── docker: сборка образов (без push) ─────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: eventmind-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          tags: eventmind-web:ci
