name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Тесты мокают реальные LLM-вызовы; фиктивный ключ нужен лишь чтобы
      # конструкция ChatGroq не падала на проверке «ключ задан».
      GROQ_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # SQLite-БД по умолчанию (DATABASE_URL не задан) — Postgres не нужен.
        run: pytest -q
