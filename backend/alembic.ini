# Alembic-конфиг v2. sqlalchemy.url берётся из окружения (env.py читает
# Settings.database_url), поэтому здесь URL не хардкодим.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# Формат имени ревизии: порядковый префикс + slug.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
