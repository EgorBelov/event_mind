[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Тесты, alembic-boilerplate и CLI-скрипты осознанно держат код до импортов
# (фикстуры-хелперы, env-setup) — E402 здесь не релевантен.
"tests/**" = ["E402"]
"alembic/**" = ["E402"]
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Гасим шум от стороннего кода, который мы не контролируем:
#   - Pydantic v1-style `.dict()` зовётся внутри langchain/langchain-groq —
#     в нашем коде вызовов нет (grep чистый), фиксить нечего до апгрейда зависимости.
#   - httpx.AsyncClient(app=...) — наш TestClient в FastAPI 0.110 использует
#     старый API, до апгрейда FastAPI/httpx менять нечего.
filterwarnings = [
    "ignore::pydantic.PydanticDeprecatedSince20",
    "ignore:The 'app' shortcut is now deprecated:DeprecationWarning",
]
